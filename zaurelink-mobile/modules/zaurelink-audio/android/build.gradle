plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.zaurelinkaudio'
version = '0.1.0'

android {
  namespace "expo.modules.zaurelinkaudio"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // TRD §3.2 DSP stage: WebRTC's software Noise Suppressor via a prebuilt JNI wrapper (JitPack).
  // Native 16kHz support, exactly 160-sample (10ms) frames, 3 aggression modes — the reason we pick
  // WebRTC NS over RNNoise (which is hardcoded to 48kHz and would need resampling).
  implementation 'com.github.deano2390:libwebrtc-android:59-NS'

  // TRD §3.1/§3.2 VAD stage: Silero VAD (ONNX). ONNX Runtime Mobile runs the bundled model directly
  // via its Kotlin/Java API — no hand-written JNI. The .onnx is bundled in this module's assets.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
